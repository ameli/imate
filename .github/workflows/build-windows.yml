name: build-windows

on:
    # push:
    #     branches:
    #         - main
    release:
        types: 
            - published
    
jobs:
    build:

        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install CUDA
              uses: Jimver/cuda-toolkit@v0.2.35
              id: cuda-toolkit
              with:
                  cuda: '13.0.0'
                  log-file-suffix: ${{ matrix.python-version }}-log.txt

            - name: Install package and dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install . -vvv
              env:
                  USE_LONG_INT: 0
                  USE_UNSIGNED_LONG_INT: 0
                  USE_CBLAS: 0
                  USE_MKL: 0
                  USE_CUDA: 0
                  CUDA_DYNAMIC_LOADING: 1

            - name: Test
              if: (matrix.python-version != '3.12')  # matplotlib still depends on deprecated distutils in the new python 3.12
              run: |
                  python -m pip install --upgrade pytest
                  python -m pip install --upgrade pytest-cov
                  mv imate imate-DoNotImport
                  pytest

            - name: Coverage
              run: |
                  python -m pip install codecov
                  codecov
